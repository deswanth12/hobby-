# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# =============================================================================
# Kavitha & Associates Chartered Accountants — Content Management Configuration
# Backend: GitHub REST API via Cloudflare Pages Serverless OAuth Proxy
# Compatible with: Sveltia CMS (Primary) and Decap CMS (Fallback)
# =============================================================================

backend:
  name: github
  repo: deswanth12/hobby-
  branch: master
  base_url: https://kavithaassociates.com
  auth_endpoint: api/auth

# Media and Upload Storage
# Images uploaded via CMS are committed to repository public/uploads/
# and referenced in markdown/JSON as /uploads/<filename>
media_folder: "public/uploads"
public_folder: "/uploads"
max_file_size: 2097152

# Firm Branding and Site Links in CMS Console
site_url: "https://kavithaassociates.com"
display_url: "https://kavithaassociates.com"
logo_url: "/favicon.svg"

# Slug Formatting & URL Sanitization
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# Editorial UI Options
show_preview_links: true

# =============================================================================
# Content Collections
# =============================================================================
collections:
  # ---------------------------------------------------------------------------
  # 1. Blog Articles Collection (Folder Collection)
  # Stores articles as Markdown files with YAML frontmatter in content/posts/
  # ---------------------------------------------------------------------------
  - name: "posts"
    label: "Blog Articles"
    label_singular: "Blog Article"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    format: "yaml-frontmatter"
    extension: "md"
    editor:
      preview: true
    fields:
      - label: "Article Title"
        name: "title"
        widget: "string"
        required: true
        hint: "Institutional title of the advisory or tax analysis article"

      - label: "URL Slug"
        name: "slug"
        widget: "string"
        required: true
        hint: "URL identifier (e.g. statutory-audit-guidelines-2026). Lowercase letters, numbers, and hyphens."
        # Slug pattern validator (^slug-pattern*$)
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Must be lowercase letters, numbers, and hyphens without leading, trailing, or double hyphens"]

      - label: "Publication Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: true
        hint: "Official publication date (YYYY-MM-DD)"

      - label: "Author"
        name: "author"
        widget: "string"
        default: "CA Kavitha Vijay"
        required: true
        hint: "Author name and professional title"

      - label: "Author Role"
        name: "authorRole"
        widget: "string"
        default: "Managing Partner"
        required: false
        hint: "Designation, professional qualifications, or firm leadership title"

      - label: "Executive Summary / Excerpt"
        name: "excerpt"
        widget: "text"
        required: true
        hint: "Brief 1-2 sentence summary displayed on blog cards and search snippets (max 200 chars)"

      - label: "Cover Image"
        name: "coverImage"
        widget: "image"
        required: false
        hint: "Hero image for article (JPEG, PNG, WebP; max 2MB)"

      - label: "Cover Image Alt Text"
        name: "coverImageAlt"
        widget: "string"
        required: false
        hint: "Descriptive alt text for accessibility and screen readers"

      - label: "Draft Status"
        name: "draft"
        widget: "boolean"
        default: true
        hint: "QUARANTINE GUARD: When enabled (true), this article is strictly excluded from public listings, direct routes, and sitemap.xml."

      - label: "Practice Categories / Tags"
        name: "tags"
        widget: "list"
        default: ["Statutory Audit"]
        hint: "Applicable practice areas (e.g. Statutory Audit, Tax Advisory, GST, Corporate Governance)"

      - label: "SEO Metadata"
        name: "seo"
        widget: "object"
        required: false
        fields:
          - label: "SEO Meta Title"
            name: "metaTitle"
            widget: "string"
            required: false
            hint: "Custom title tag (defaults to Article Title if left blank)"

          - label: "SEO Meta Description"
            name: "metaDescription"
            widget: "text"
            required: false
            hint: "Custom meta description for search engines (defaults to Excerpt if left blank)"

          - label: "Canonical URL"
            name: "canonicalUrl"
            widget: "string"
            required: false
            hint: "Optional canonical link override"

      - label: "Article Content"
        name: "body"
        widget: "markdown"
        required: true
        hint: "Full article body formatted in standard Markdown"

  # ---------------------------------------------------------------------------
  # 2. Approved Static Website Sections (Files Collection / Singletons)
  # Stores section content as structured JSON in content/sections/
  # ---------------------------------------------------------------------------
  - name: "sections"
    label: "Website Content"
    delete: false
    files:
      # --- About Practice & Partner ---
      - name: "about"
        label: "About the Firm & Partner"
        file: "content/sections/about.json"
        fields:
          - label: "Partner Biography"
            name: "partnerBio"
            widget: "object"
            fields:
              - { label: "Partner Name", name: "name", widget: "string", default: "CA Kavitha Vijay" }
              - { label: "Designations & Credentials", name: "qualifications", widget: "string", default: "B.Com, CA, CMA (AIR 49) | ICAI Mem. 252985" }
              - { label: "Firm Designation", name: "designation", widget: "string", default: "Managing Partner" }
              - { label: "Years of Practice", name: "experienceYears", widget: "string", default: "10+" }
              - { label: "Executive Biography", name: "bio", widget: "markdown" }
              - label: "Core Competencies"
                name: "coreCompetencies"
                widget: "list"
                default:
                  - "Statutory Audit & Assurance"
                  - "Direct & Corporate Tax Advisory"
                  - "GST Appellate Representation"
                  - "Corporate Governance & Restructuring"
          - label: "ICAI Regulatory Compliance Note"
            name: "complianceStatement"
            widget: "text"
            default: "In accordance with ICAI regulations and the Chartered Accountants Act, 1949, this portal is designed solely to provide factual information regarding professional services offered by Kavitha & Associates."

      # --- Homepage Spotlight Content ---
      - name: "homepage"
        label: "Homepage Content"
        file: "content/sections/homepage.json"
        fields:
          - label: "Hero Banner"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Primary Headline", name: "headlinePrimary", widget: "string", default: "Statutory Rigor." }
              - { label: "Accent Headline", name: "headlineAccent", widget: "string", default: "Practical Commercial Counsel." }
              - { label: "Lead Narrative", name: "leadNarrative", widget: "text", default: "Founded by CA Kavitha Vijay (ICAI Mem. 252985 | B.Com, CA, CMA AIR 49), an MNC Auditor with 10+ years of Big 4 (Deloitte) and Fortune 50 multinational experience, our chambers deliver uncompromising statutory fidelity and strategic commercial counsel." }
              - { label: "Trust Badge Text", name: "badgeText", widget: "string", default: "Chartered Accountancy Chambers — Tirupati" }
          - label: "Practice Pillars"
            name: "pillars"
            widget: "list"
            fields:
              - { label: "Pillar Title", name: "title", widget: "string" }
              - { label: "Pillar Description", name: "description", widget: "text" }
          - { label: "Chambers Spotlight Headline", name: "chambersHeadline", widget: "string", default: "Precision in Audits. Authority in Taxation." }

      # --- Practice Service Descriptions ---
      - name: "services"
        label: "Practice Services & Statutory Frameworks"
        file: "content/sections/services.json"
        fields:
          - label: "Service Categories"
            name: "serviceCategories"
            widget: "list"
            fields:
              - { label: "Service ID", name: "id", widget: "string" }
              - { label: "Service Title", name: "title", widget: "string" }
              - { label: "Short Description", name: "shortDescription", widget: "text" }
              - { label: "Full Description", name: "fullDescription", widget: "text" }
              - { label: "Statutory Framework", name: "statutoryFramework", widget: "string" }
              - { label: "Target Clients", name: "targetClients", widget: "string" }
              - { label: "Icon Name", name: "iconName", widget: "string", required: false }
              - label: "Included Services"
                name: "services"
                widget: "list"
                required: false

      # --- Approved Client FAQs ---
      - name: "faqs"
        label: "Approved Client FAQs"
        file: "content/sections/faqs.json"
        fields:
          - label: "Approved FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "FAQ ID", name: "id", widget: "string" }
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
              - { label: "Practice Category", name: "category", widget: "string" }
              - { label: "Statutory Reference", name: "statuteReference", widget: "string" }

      # --- Chambers Contact Information ---
      - name: "contact"
        label: "Chambers Contact & Consultation Details"
        file: "content/sections/contact.json"
        fields:
          - { label: "Firm Name", name: "firmName", widget: "string", default: "Kavitha & Associates" }
          - label: "Contact Channels"
            name: "contactChannels"
            widget: "object"
            fields:
              - { label: "Primary Phone", name: "primaryPhone", widget: "string", default: "+91 96263 50900" }
              - { label: "Secondary Phone", name: "secondaryPhone", widget: "string", default: "+91 95421 53906" }
              - { label: "Official Email", name: "email", widget: "string", default: "cakavithasrj@gmail.com" }
              - { label: "WhatsApp Link", name: "whatsappLink", widget: "string", default: "https://wa.me/919626350900" }
          - label: "Physical Chambers"
            name: "physicalChambers"
            widget: "object"
            fields:
              - { label: "Street Address", name: "address", widget: "text", default: "Bairagi Patteda" }
              - { label: "City", name: "city", widget: "string", default: "Tirupati" }
              - { label: "State", name: "state", widget: "string", default: "Andhra Pradesh" }
              - { label: "Postal Code", name: "pincode", widget: "string", default: "517501" }
              - { label: "Google Maps URL", name: "mapsUrl", widget: "string", default: "https://www.google.com/maps?q=13.61925,79.418028" }
          - { label: "Office Hours", name: "officeHours", widget: "string", default: "Mon - Sat: 9:30 AM - 7:30 PM | Sun: Closed / Prior Appointment Only" }
