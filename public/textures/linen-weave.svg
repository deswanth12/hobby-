      <path d="M0 8h16" stroke="#C3A66B" stroke-width="0.5" stroke-opacity="0.03"/>
      <path d="M4 0v16 M12 0v16" stroke="#302B24" stroke-width="0.75" stroke-opacity="0.025" stroke-dasharray="2,2"/>
      <path d="M8 0v16" stroke="#C3A66B" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>
  </defs>
  <filter id="linen-noise" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.22  0 0 0 0 0.18  0 0 0 0.025 0"/>
