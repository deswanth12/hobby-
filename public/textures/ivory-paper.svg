<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <filter id="ivory-paper" x="0%" y="0%" width="100%" height="100%">
    <!-- Gentle organic tooth for ivory paper texture -->
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" stitchTiles="stitch" result="paperTooth"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.70" numOctaves="3" stitchTiles="stitch" result="grain"/>
    <feComposite in="paperTooth" in2="grain" operator="arithmetic" k1="0" k2="0.28" k3="0.72" k4="0" result="ivoryParchment"/>
    <feColorMatrix in="ivoryParchment" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.21  0 0 0 0 0.15  0 0 0 0.040 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#ivory-paper)"/>
</svg>
