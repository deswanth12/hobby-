<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#153F32" />
      <stop offset="50%" stop-color="#0B241C" />
      <stop offset="100%" stop-color="#071913" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E2BB" />
      <stop offset="50%" stop-color="#C3A66B" />
      <stop offset="100%" stop-color="#9E7B35" />
    </linearGradient>
  </defs>

  <!-- Deep Botanical Forest Green Squircle Tile with Handcrafted Antique Gold Border -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tileBg)" stroke="#C3A66B" stroke-width="6" />

  <!-- Inner Architectural Accent Ring -->
  <rect x="18" y="18" width="220" height="220" rx="44" fill="none" stroke="#C3A66B" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- KA Monogram Group centered in 256x256 -->
  <g transform="translate(-8, 30) scale(1.18)">
    <!-- Letter K: Classical Roman Serif in Crisp Architectural White -->
    <g id="letter-K" fill="#FFFFFF">
      <path d="M 35 34 L 43 34 L 43 136 L 35 136 C 32 136, 30 137, 30 140 L 30 142 L 60 142 L 60 140 C 60 137, 58 136, 55 136 L 48 136 L 48 34 L 55 34 C 58 34, 60 33, 60 30 L 60 28 L 30 28 L 30 30 C 30 33, 32 34, 35 34 Z" />
      <path d="M 48 94 L 95 36 L 88 36 C 85 36, 84 35, 84 32 L 84 28 L 115 28 L 115 32 C 115 35, 113 36, 110 36 L 104 36 L 62 88 Z" />
      <path d="M 54 84 L 98 136 L 92 136 C 89 136, 88 137, 88 140 L 88 142 L 122 142 C 120 138, 117 136, 112 133 L 72 84 Z" />
    </g>

    <!-- Letter A: Classical Intertwined Serif in Refined Matte Gold -->
    <g id="letter-A" fill="url(#goldGrad)">
      <path d="M 125 28 L 145 28 L 143 33 L 127 33 Z" />
      <path d="M 133 33 L 90 136 L 84 136 C 81 136, 80 137, 80 140 L 80 142 L 108 142 L 108 140 C 108 137, 106 136, 103 136 L 98 136 L 112 102 L 136 102 L 138 95 L 115 95 L 137 42 Z" />
      <path d="M 137 33 L 170 136 L 165 136 C 162 136, 160 137, 160 140 L 160 142 L 190 142 L 190 140 C 190 137, 188 136, 184 136 L 178 136 L 148 33 Z" />
      <path d="M 112 102 L 158 102 L 157 106 L 111 106 Z" opacity="0.9" />
    </g>

    <!-- Financial Growth Bars -->
    <g id="growth-bars" fill="#F4E2BB">
      <rect x="131" y="90" width="4.5" height="12" rx="1.2" />
      <rect x="138" y="82" width="4.5" height="20" rx="1.2" />
      <rect x="145" y="74" width="4.5" height="28" rx="1.2" />
    </g>

    <!-- Dynamic Trajectory Swoosh -->
    <path id="dynamic-swoosh"
          d="M 28 88 C 48 83, 76 87, 105 103 C 128 116, 152 119, 180 110 C 162 115, 140 112, 118 102 C 88 88, 56 82, 28 88 Z"
          fill="url(#goldGrad)" />

    <!-- Secondary Upper Accent Arc -->
    <path id="crest-swoosh"
          d="M 88 116 C 120 78, 160 58, 204 65 C 172 66, 138 82, 108 114 C 101 122, 94 125, 88 116 Z"
          fill="url(#goldGrad)"
          opacity="0.95" />
  </g>
</svg>
