<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <filter id="warm-plaster" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" stitchTiles="stitch" result="low"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" stitchTiles="stitch" result="high"/>
    <feComposite in="low" in2="high" operator="arithmetic" k1="0" k2="0.6" k3="0.4" k4="0" result="combined"/>
    <feColorMatrix in="combined" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 0.04 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#warm-plaster)"/>
</svg>
